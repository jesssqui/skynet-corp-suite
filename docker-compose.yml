# The suite on the Mac mini. See DEPLOY.md for the full steps.
#   docker compose up -d --build
# Reachable only at http://127.0.0.1:3100 on the Mac itself; Tailscale Serve
# puts HTTPS in front of it for your tailnet. Nothing is exposed to the LAN or
# the internet. Everything except the sign-in screen needs a signed-in account.
name: suite

services:
  suite:
    build:
      context: .
      args:
        APP_COMMIT: ${APP_COMMIT:-}
    image: suite:local
    container_name: suite
    restart: unless-stopped
    ports:
      # Host loopback only. Do not change to "3100:3100" — that would publish
      # the port on every network interface of the Mac.
      - "127.0.0.1:${SUITE_PORT:-3100}:3100"
    environment:
      TZ: ${TZ:-America/Toronto}
      BACKUP_TIME: ${BACKUP_TIME:-03:15}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Whose X-Forwarded-* headers to believe (Express "trust proxy"). Tailscale Serve proxies
      # from the Mac's loopback, but Docker Desktop's port forwarder makes those connections
      # arrive in the container from its network gateway (a 172.x / 192.168.x address), hence
      # "uniquelocal". Safe only because the port is published on 127.0.0.1 alone (below).
      # Wrong here = sign-in fails with "Request from another origin" (see DEPLOY.md).
      TRUST_PROXY: ${TRUST_PROXY:-loopback, uniquelocal}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      SESSION_IDLE_DAYS: ${SESSION_IDLE_DAYS:-30}
      SESSION_MAX_DAYS: ${SESSION_MAX_DAYS:-90}
      # D1: the address the Connections page tells you to enter in the Order Manager (its container
      # reaches this suite through Docker Desktop's host.docker.internal; see DEPLOY.md).
      SUITE_PORT: ${SUITE_PORT:-3100}
      WOM_CONNECT_URL: ${WOM_CONNECT_URL:-}
      # C6a: the suite's ts.net address for calendar links (DEPLOY.md step 7); empty = the address used.
      SUITE_URL: ${SUITE_URL:-}
      CALENDAR_TIME_ZONE: ${CALENDAR_TIME_ZONE:-}
    volumes:
      # Live database: a Docker named volume (inside Docker's Linux VM), which is
      # where SQLite's WAL locking is reliable. Not a folder on the Mac.
      - suite-data:/app/data
      # Off-machine backup folder on the Mac (cloud-synced folder or mounted
      # network share). Must contain the .suite-backup-target marker file.
      - ${SUITE_OFFSITE_DIR:?Set SUITE_OFFSITE_DIR in .env - see DEPLOY.md}:/offsite
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  suite-data:
